name: Build A36 Good Lock Spoofer APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      SIGNING_KEY_BASE64: ${{ secrets.SIGNING_KEY_BASE64 }}
      STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
      KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
      KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Unpack source archive
        run: |
          if [ -f "A36GoodLockSpoofer-v3.zip" ]; then
            unzip -o A36GoodLockSpoofer-v3.zip -d .
          elif [ -f "A36GoodLockSpoofer.zip" ]; then
            unzip -o A36GoodLockSpoofer.zip -d .
          else
            echo "Source ZIP not found!"
            exit 1
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.4'

      - name: Restore signing keystore
        run: |
          mkdir -p "$RUNNER_TEMP/signing"
          echo "$SIGNING_KEY_BASE64" | base64 --decode > "$RUNNER_TEMP/signing/release-key.jks"
          test -s "$RUNNER_TEMP/signing/release-key.jks"

      - name: Configure release signing
        run: |
          cat >> app/build.gradle <<'EOF'

          android {
              signingConfigs {
                  release {
                      storeFile file(System.getenv("RUNNER_TEMP") + "/signing/release-key.jks")
                      storePassword System.getenv("STORE_PASSWORD")
                      keyAlias System.getenv("KEY_ALIAS")
                      keyPassword System.getenv("KEY_PASSWORD")
                  }
              }

              buildTypes {
                  release {
                      signingConfig signingConfigs.release
                  }
              }
          }
          EOF

      - name: Build Release APK
        run: gradle assembleRelease

      - name: Verify APK signature
        run: |
          APK="app/build/outputs/apk/release/app-release.apk"
          test -s "$APK"
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name "apksigner" | sort -V | tail -n 1)
          "$APKSIGNER" verify --verbose "$APK"

      - name: Prepare APK
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk \
            dist/A36GoodLockSpoofer.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: A36GoodLockSpoofer-Release
          path: dist/A36GoodLockSpoofer.apk
          if-no-files-found: error
          retention-days: 30
