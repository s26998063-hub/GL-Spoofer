name: Build A36 Good Lock Spoofer APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Unpack source archive if present
        run: |
          if [ -f "A36GoodLockSpoofer-v3.zip" ]; then
            unzip -o A36GoodLockSpoofer-v3.zip -d .
          elif [ -f "A36GoodLockSpoofer.zip" ]; then
            unzip -o A36GoodLockSpoofer.zip -d .
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.4'

      - name: Build Debug & Release APK
        run: gradle assembleDebug assembleRelease

      - name: Rename output APK
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/A36GoodLockSpoofer.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: A36GoodLockSpoofer-APK
          path: dist/A36GoodLockSpoofer.apk
